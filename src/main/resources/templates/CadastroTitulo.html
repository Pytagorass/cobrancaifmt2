<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <meta charset="UTF-8">
    <title>Cobrança </title>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary py-3">
        <a class="navbar-brand" href="/titulos/novo">
            <img src="/images/ifmtlogo.png" width="50" height="50" alt="Logo IFMT">
        </a>
    </nav>

    <main class="container-fluid px-2 mt-2">
        <div class="card">
            <div class="card-header">
                Novo título
            </div>

            <div class="card-body">
                <form action="/titulos" method="post">

                    <!-- Exibe a mensagem de sucesso apenas quando o controller enviar "mensagem". -->
                    <div class="alert alert-success alert-dismissible fade show" role="alert"
                         th:if="${mensagem != null}">
                        <button type="button" class="close" data-dismiss="alert" aria-label="Fechar">
                            <span aria-hidden="true">&times;</span>
                        </button>
                        <span th:text="${mensagem}"></span>
                    </div>

                    <div class="form-group row">
                        <label for="descricao" class="col-sm-2 col-form-label">
                            Descrição
                        </label>
                        <div class="col-sm-4">
                            <input type="text" class="form-control"
                                   id="descricao" name="descricao"
                                   placeholder="Descrição">
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="dataVencimento" class="col-sm-2 col-form-label">
                            Data de Vencimento
                        </label>
                        <div class="col-sm-2">
                            <!-- Campo texto para permitir mascara no padrao brasileiro dd/mm/aaaa. -->
                            <input type="text" class="form-control"
                                   id="dataVencimento" name="dataVencimento"
                                   placeholder="dd/mm/aaaa"
                                   pattern="\d{2}/\d{2}/\d{4}"
                                   maxlength="10">
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="valor" class="col-sm-2 col-form-label">Valor</label>
                        <div class="col-sm-2">
                            <!-- Campo texto para aceitar virgula decimal, como 123,50. -->
                            <input type="text" class="form-control"
                                   id="valor" name="valor"
                                   placeholder="0,00"
                                   inputmode="decimal">
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="status" class="col-sm-2 col-form-label">Status</label>
                        <div class="col-sm-2">
                            <select class="form-control" id="status" name="status">
                                <option th:each="status : ${todosStatusTitulo}"
                                        th:value="${status}"
                                        th:text="${status.descricao}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="offset-sm-2 col-sm-10">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var dataInput = document.getElementById('dataVencimento');
            var valorInput = document.getElementById('valor');

            if (dataInput) {
                dataInput.addEventListener('input', function () {
                    // Mantem apenas numeros e monta a data no formato dd/mm/aaaa.
                    var digits = dataInput.value.replace(/\D/g, '').slice(0, 8);
                    var parts = [];

                    if (digits.length > 0) {
                        parts.push(digits.slice(0, 2));
                    }
                    if (digits.length > 2) {
                        parts.push(digits.slice(2, 4));
                    }
                    if (digits.length > 4) {
                        parts.push(digits.slice(4, 8));
                    }

                    dataInput.value = parts.join('/');
                });
            }

            if (valorInput) {
                valorInput.addEventListener('input', function () {
                    // Trata os dois ultimos digitos como centavos e usa virgula decimal.
                    var digits = valorInput.value.replace(/\D/g, '');

                    if (!digits) {
                        valorInput.value = '';
                        return;
                    }

                    var cents = digits.padStart(3, '0');
                    var integerPart = cents.slice(0, -2).replace(/^0+(?=\d)/, '');
                    var decimalPart = cents.slice(-2);

                    integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                    valorInput.value = integerPart + ',' + decimalPart;
                });
            }
        });
    </script>
</body>
</html>
