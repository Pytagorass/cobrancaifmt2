# Banco H2 em memoria: os dados existem apenas enquanto a aplicacao estiver rodando.
spring.datasource.url=jdbc:h2:mem:cobrancaifmt
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 para consultar as tabelas em /h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# O Hibernate atualiza/cria as tabelas a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Formato usado pelo Spring MVC ao converter datas recebidas dos formularios.
spring.mvc.format.date=dd/MM/yyyy
