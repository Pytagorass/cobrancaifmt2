# Conectar ao banco MySQL. O banco deve ser criado antes de iniciar a aplicacao.
spring.datasource.url=jdbc:mysql://localhost:3306/cobrancaifmt
spring.datasource.username=root
spring.datasource.password=12345678

# O Hibernate atualiza/cria as tabelas a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Formato usado pelo Spring MVC ao converter datas recebidas dos formularios.
spring.mvc.format.date=dd/MM/yyyy
